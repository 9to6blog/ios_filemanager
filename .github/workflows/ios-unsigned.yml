name: Build AltStore IPA
on:
  workflow_dispatch:
    inputs:
      capture_preview:
        description: Build and capture the iOS simulator as well
        type: boolean
        default: true
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Check native file safety
        run: node scripts/test-native-core.mjs
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -workspace ios/MoaFiles.xcworkspace -scheme MoaFiles -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build > build-ios.log 2>&1 || { tail -n 100 build-ios.log; exit 1; }
      - name: Package and verify IPA
        run: bash scripts/package-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MoaFiles-unsigned-${{ github.run_number }}
          path: |
            build/MoaFiles.ipa
            build/MoaFiles.sha256
            build/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log-${{ github.run_number }}
          path: build-ios.log
          retention-days: 3
  simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.capture_preview
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: ios
      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/MoaFiles.xcworkspace -scheme MoaFiles -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > build-simulator.log 2>&1 || { tail -n 100 build-simulator.log; exit 1; }
      - name: Launch native app and capture light and dark screens
        run: bash scripts/simulator-preview.sh
      - name: Verify public browser, selection controls and app lock
        run: |
          set -euo pipefail
          ruby scripts/setup-uitests.rb
          udid=$(node -p 'require("./build/preview/simulator.json").udid')
          xcrun simctl ui "$udid" appearance light
          xcodebuild -workspace ios/MoaFiles.xcworkspace -scheme MoaFilesUITests -configuration Release -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/simulator -resultBundlePath build/preview/UITests.xcresult -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test > build/preview/ui-tests.log 2>&1 || { tail -n 120 build/preview/ui-tests.log; exit 1; }
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d build/preview/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/preview/UITests.xcresult --output-path build/preview/test-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-preview-${{ github.run_number }}
          path: |
            build/preview/
            build-simulator.log
          retention-days: 7
